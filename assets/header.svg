<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient: Pure Black to Deep Charcoal -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Subtle Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      .primary-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 4.5px;
        fill: #FFFFFF;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 4px;
        fill: #FFFFFF;
      }
      .supporting-line {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 3.5px;
        fill: #D7BE98;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="8" fill="url(#headerBg)" />
  <rect width="1200" height="360" rx="8" fill="url(#centerGlow)" />

  <!-- Restrained Minimalist Outer Border -->
  <rect x="8" y="8" width="1184" height="344" rx="6" fill="none" stroke="#222222" stroke-width="1" />

  <!-- Center Typography (Stationary, High-Contrast, Immediate Load) -->
  <text x="600" y="160" text-anchor="middle" class="primary-title">KINGSTON SHASANTH</text>
  <text x="600" y="212" text-anchor="middle" class="subtitle">ASPIRING SOFTWARE ENGINEER</text>
  <text x="600" y="255" text-anchor="middle" class="supporting-line">SOFTWARE DEVELOPMENT · MACHINE LEARNING · ARTIFICIAL INTELLIGENCE</text>

  <!-- Monochrome Architectural Signal Path -->
  <!-- Base Grounding Track -->
  <path d="M 120 295 L 860 295 L 900 318 L 1080 318" 
        fill="none" stroke="#FFFFFF" stroke-width="1.25" stroke-opacity="0.85" stroke-linecap="round" />

  <!-- Smooth Flowing Highlight Pulse Along Signal Path -->
  <path d="M 120 295 L 860 295 L 900 318 L 1080 318" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" 
        stroke-dasharray="140 860" stroke-dashoffset="1000" opacity="0.95">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Clean Signal Endpoint Node -->
  <circle cx="1080" cy="318" r="3.5" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
