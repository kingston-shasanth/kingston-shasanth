<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient: Pure Black to Deep Charcoal -->
    <linearGradient id="footerBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="60%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <style>
      .signoff-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 3.5px;
        fill: #FFFFFF;
      }
      .signoff-subline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 2.5px;
        fill: #B8B8B8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="150" rx="6" fill="url(#footerBg)" />

  <!-- Subtle Outer Border -->
  <rect x="8" y="8" width="1184" height="134" rx="5" fill="none" stroke="#171717" stroke-width="1" />

  <!-- Closing Typography -->
  <text x="600" y="65" text-anchor="middle" class="signoff-title">ENGINEER WITH PURPOSE.</text>
  <text x="600" y="94" text-anchor="middle" class="signoff-subline">BUILD THOUGHTFULLY. SOLVE MEANINGFULLY. IMPROVE CONTINUOUSLY.</text>

  <!-- Restrained Geometric Line Resolving into Clean White Endpoint -->
  <path d="M 180 118 L 840 118 L 875 104 L 1020 104" 
        fill="none" stroke="#FFFFFF" stroke-width="1.25" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- Traveling Highlight Pulse -->
  <path d="M 180 118 L 840 118 L 875 104 L 1020 104" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" 
        stroke-dasharray="100 800" stroke-dashoffset="900" opacity="0.95">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Clean Endpoint Node -->
  <circle cx="1020" cy="104" r="3" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
  </circle>
</svg>
