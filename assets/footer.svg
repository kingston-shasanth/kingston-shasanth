<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient: Coordinated with Header -->
    <linearGradient id="footerBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10171B" />
      <stop offset="50%" stop-color="#17383B" />
      <stop offset="85%" stop-color="#241E26" />
      <stop offset="100%" stop-color="#10171B" />
    </linearGradient>

    <!-- Copper Current Accent Gradient -->
    <linearGradient id="footerCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88763" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#D7BE98" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#B88763" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D7BE98" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="footerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D7BE98" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#B88763" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#10171B" stop-opacity="0" />
    </radialGradient>

    <style>
      .footer-signoff {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3.5px;
        fill: #F3EFE7;
      }
      .footer-brand {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #9BAFA8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="140" rx="10" fill="url(#footerBg)" />
  <rect width="1200" height="140" rx="10" fill="url(#footerGlow)" />

  <!-- Outer Architectural Border -->
  <rect x="10" y="10" width="1180" height="120" rx="6" fill="none" stroke="#B88763" stroke-width="0.85" stroke-opacity="0.25" />

  <!-- Corner Trim -->
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 1180 30 L 1180 20 L 1170 20" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 20 110 L 20 120 L 30 120" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 1180 110 L 1180 120 L 1170 120" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="round" />

  <!-- Converging Copper Current Lines -->
  <path d="M -20 40 C 220 90, 440 20, 600 55 C 760 90, 980 20, 1220 60" 
        fill="none" stroke="url(#footerCopper)" stroke-width="1.25" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="22s" repeatCount="indefinite" />
  </path>

  <path d="M -20 100 C 240 60, 460 110, 600 85 C 740 60, 960 115, 1220 80" 
        fill="none" stroke="url(#footerCopper)" stroke-width="0.85" stroke-opacity="0.4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="26s" repeatCount="indefinite" />
  </path>

  <!-- Central Diamond Accent -->
  <polygon points="600,28 605,33 600,38 595,33" fill="#D7BE98" opacity="0.8" />
  <line x1="440" y1="33" x2="585" y2="33" stroke="#B88763" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="615" y1="33" x2="760" y2="33" stroke="#B88763" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Center Sign-Off & Brand Statement -->
  <text x="600" y="68" text-anchor="middle" class="footer-signoff">ENGINEERED WITH RIGOR · BUILT WITH PURPOSE · ALWAYS LEARNING</text>
  <text x="600" y="98" text-anchor="middle" class="footer-brand">KINGSTON SHASANTH · PORTFOLIO EDITION</text>
</svg>
