<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient: Deeper Charcoal & Petrol Baseline -->
    <linearGradient id="footerBgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1418" />
      <stop offset="40%" stop-color="#142C2F" />
      <stop offset="80%" stop-color="#201A24" />
      <stop offset="100%" stop-color="#0E1418" />
    </linearGradient>

    <!-- Copper Accent Gradient -->
    <linearGradient id="footerCopperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88763" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#D7BE98" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#B88763" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D7BE98" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="footerFocalGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D7BE98" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#B88763" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0E1418" stop-opacity="0" />
    </radialGradient>

    <style>
      .footer-brand {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 3.5px;
        fill: #9BAFA8;
      }
      .footer-signoff {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 4px;
        fill: #F3EFE7;
      }
      .footer-subline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 3px;
        fill: #D7BE98;
      }
      .footer-meta {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 8.5px;
        font-weight: 500;
        letter-spacing: 2px;
        fill: #9BAFA8;
        opacity: 0.55;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="160" rx="8" fill="url(#footerBgGrad)" />
  <rect width="1200" height="160" rx="8" fill="url(#footerFocalGlow)" />

  <!-- Outer Architectural Border -->
  <rect x="12" y="12" width="1176" height="136" rx="6" fill="none" stroke="#B88763" stroke-width="0.85" stroke-opacity="0.25" />
  <rect x="16" y="16" width="1168" height="128" rx="4" fill="none" stroke="#9BAFA8" stroke-width="0.6" stroke-opacity="0.1" />

  <!-- Corner Registration Trim -->
  <path d="M 24 34 L 24 24 L 34 24" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="square" />
  <path d="M 1176 34 L 1176 24 L 1166 24" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="square" />
  <path d="M 24 126 L 24 136 L 34 136" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="square" />
  <path d="M 1176 126 L 1176 136 L 1166 136" fill="none" stroke="#B88763" stroke-width="1.5" stroke-linecap="square" />

  <!-- Technical Crosshairs -->
  <g stroke="#D7BE98" stroke-width="0.75" opacity="0.35">
    <path d="M 50 25 L 50 33 M 46 29 L 54 29" />
    <path d="M 1150 25 L 1150 33 M 1146 29 L 1154 29" />
  </g>

  <!-- Single Refined Geometric Architectural Signal Line -->
  <path d="M 16 80 L 320 80 L 380 45 L 820 45 L 880 80 L 1184 80" 
        fill="none" stroke="url(#footerCopperGrad)" stroke-width="1.25" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="240" dur="24s" repeatCount="indefinite" />
  </path>

  <!-- Central Anchor Diamond & Technical Crosshair -->
  <g transform="translate(600, 45)">
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#D7BE98" opacity="0.85" />
    <line x1="-140" y1="0" x2="-20" y2="0" stroke="#B88763" stroke-width="0.75" stroke-opacity="0.4" />
    <line x1="20" y1="0" x2="140" y2="0" stroke="#B88763" stroke-width="0.75" stroke-opacity="0.4" />
  </g>

  <!-- Subtle Corner Metadata -->
  <text x="32" y="32" class="footer-meta">ARCH.TERMINUS</text>
  <text x="1168" y="32" class="footer-meta" text-anchor="end">SYS.VER // 2026</text>

  <!-- Central Typography -->
  <text x="600" y="75" text-anchor="middle" class="footer-brand">KINGSTON SHASANTH // PORTFOLIO ARCHITECTURE</text>
  <text x="600" y="102" text-anchor="middle" class="footer-signoff">ENGINEERED WITH RIGOR · BUILT WITH PURPOSE</text>
  <text x="600" y="126" text-anchor="middle" class="footer-subline">CONTINUOUSLY LEARNING. BUILDING WHAT MATTERS.</text>
</svg>
